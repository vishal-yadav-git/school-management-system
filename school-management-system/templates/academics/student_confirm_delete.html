<!DOCTYPE html>
<html>

<head>

    <title>Delete Student</title>

</head>

<body>

    <h2>Delete Student</h2>

    <p>

        Are you sure you want to delete

        <strong>
            {{ student.user.get_full_name }}
        </strong>?

    </p>

    <p>
        Admission Number:
        {{ student.admission_number }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'student_list' %}">
            Cancel
        </a>

    </form>

</body>

</html>
