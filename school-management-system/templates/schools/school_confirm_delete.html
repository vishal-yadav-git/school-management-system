<!DOCTYPE html>
<html>

<head>

    <title>Delete School</title>

</head>

<body>

    <h2>Delete School</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ school.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'school_list' %}">
            Cancel
        </a>

    </form>

</body>

</html>
