<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    {% if error %}

        <p style="color:red;">
            {{ error }}
        </p>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p>

        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>

    </p>

</body>

</html>
